<!DOCTYPE html>
<html>
<head>
    <title>Login - Fake News Detector</title>
    <style>
        body {font-family: Arial; background: #f1f1f1; text-align: center;}
        .container {margin: 100px auto; width: 350px; background: white; padding: 30px; border-radius: 10px;}
        input {width: 90%; padding: 10px; margin: 10px 0;}
        button {background: #3498db; color: white; border: none; padding: 10px 20px; cursor: pointer;}
        a {color: #3498db;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a></p>
    </div>
</body>
</html>
