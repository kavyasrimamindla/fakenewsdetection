<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Fake News Detection</title>
    <style>
        body {font-family: Arial; background: #ecf0f1; text-align: center;}
        .container {margin: 50px auto; width: 600px; background: white; padding: 30px; border-radius: 10px;}
        textarea {width: 90%; height: 120px; padding: 10px;}
        button {background: #2980b9; color: white; border: none; padding: 10px 20px; cursor: pointer;}
        .logout, .history {margin: 10px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ user }}</h2>
        <form method="POST">
            <textarea name="news" placeholder="Enter news text here..." rows="5" cols="60">{{ request.form.news or '' }}</textarea>

            <button type="submit">Check News</button>
        </form>

        {% if result %}
        <h3>Result: <span style="color: {% if result == 'FAKE' %}red{% else %}green{% endif %};">{{ result }}</span></h3>
        <p>Fake: {{ fake_prob }}% | Real: {{ real_prob }}%</p>
        <img src="data:image/png;base64,{{ image_base64 }}" width="300">
        {% endif %}

        <div>
            <a href="{{ url_for('history') }}" class="history">View History</a> |
            <a href="{{ url_for('logout') }}" class="logout">Logout</a>
        </div>
    </div>
</body>
</html>
